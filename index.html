<style>
/* layout: one full-screen 3D bowl; thin UI floats on top (logo/CA/BUY/X up top, money counter low centre, feed bottom-left) */
:root{
  --sky-hi:#d6f4ff; --sky:#4fb2ff; --sky-deep:#1663e6; --sky-ink:#0a3aa6;
  --cheese:#f6a21c; --cheese-deep:#c9640a; --cream:#fffdf6; --ink:#16120c; --red:#e3262e; --green:#14a05a;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overflow-x:clip}
body{margin:0;background:var(--sky-deep);color:var(--cream);font-family:var(--mono);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
.sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,var(--sky-hi) 0%,var(--sky) 20%,var(--sky-deep) 52%,var(--sky-ink) 100%);overflow:hidden}
.sky::before{content:"";position:absolute;left:50%;top:38%;width:300vmax;height:300vmax;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0deg 2.6deg,rgba(255,255,255,0) 2.6deg 7.2deg);
  -webkit-mask:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 30%,transparent 62%);mask:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 30%,transparent 62%);
  animation:spin 140s linear infinite}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.6px) 0 0/7px 7px;
  -webkit-mask:radial-gradient(circle at 50% 38%,transparent 30%,#000 90%);mask:radial-gradient(circle at 50% 38%,transparent 30%,#000 90%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
#splat{position:fixed;inset:0;pointer-events:none;z-index:6}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.logo{display:flex;align-items:baseline;gap:10px;line-height:.8;opacity:0;transform:scale(2.6) rotate(-8deg);transform-origin:20% 60%}
body.live .logo{animation:slam .62s cubic-bezier(.2,1.6,.4,1) 1.15s forwards}
@keyframes slam{to{opacity:1;transform:none}}
.logo b{font-family:var(--display);font-weight:400;font-size:clamp(56px,8.5vw,108px);color:var(--cheese);letter-spacing:-.02em;
  -webkit-text-stroke:5px var(--cream);paint-order:stroke fill;text-shadow:0 6px 0 var(--cheese-deep),0 10px 0 rgba(10,30,90,.35),0 18px 30px rgba(10,30,90,.35)}
.logo span{font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.08em;background:var(--ink);color:var(--cheese);padding:5px 8px;border-radius:7px;transform:translateY(-10px) rotate(-4deg)}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--mono);font-weight:800;font-size:14px;letter-spacing:.04em;border:0;border-radius:999px;padding:12px 16px;display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;cursor:pointer;color:var(--ink);background:var(--cream);box-shadow:0 4px 0 rgba(10,30,90,.45);transition:transform .12s}
.pill:hover{transform:translateY(-2px)} .pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(10,30,90,.45)}
.pill:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pill.buy{background:var(--cheese);color:var(--ink);box-shadow:0 4px 0 var(--cheese-deep);font-size:16px;padding:12px 22px}
.pill.x{padding:12px 13px}
.pill.off,.pill:disabled{opacity:.62;cursor:default;transform:none}
.pill.ok{background:var(--green);color:var(--cream)}
#ca small{font-weight:400;opacity:.6}

/* counter */
#counter{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;width:min(92vw,720px)}
#longUsd{font-family:var(--display);font-size:clamp(40px,6.4vw,84px);line-height:.95;color:var(--cream);font-variant-numeric:tabular-nums;
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 rgba(10,30,90,.45)}
#counter .lbl{font-weight:800;font-size:clamp(12px,1.4vw,15px);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;text-shadow:0 2px 0 rgba(10,30,90,.5)}
#counter .sub{font-size:12px;letter-spacing:.04em;margin-top:6px;opacity:.85;text-shadow:0 1px 0 rgba(10,30,90,.5)}
#counter .sub b{color:#9cf5c6}
#counter.loading #longUsd{color:transparent;-webkit-text-stroke:0;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.4),rgba(255,255,255,.18));background-size:200% 100%;
  border-radius:16px;animation:sh 1.2s linear infinite;width:min(70vw,460px);margin:0 auto}
#counter.loading .lbl,#counter.loading .sub{opacity:.4}
@keyframes sh{to{background-position:-200% 0}}

/* feed */
#feed{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;list-style:none;margin:0;padding:0;
  display:flex;flex-direction:column;gap:5px;width:250px;pointer-events:none}
#feed li{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;background:rgba(255,253,246,.94);color:var(--ink);border-radius:12px;padding:7px 10px;
  font-size:12px;box-shadow:0 3px 0 rgba(10,30,90,.35);animation:in .35s cubic-bezier(.2,1.4,.4,1);border-left:6px solid var(--red)}
#feed li.short{border-left-color:var(--green)}
#feed li b{font-family:var(--display);font-weight:400;font-size:17px}
#feed li span{font-weight:800;text-transform:uppercase;letter-spacing:.03em}
#feed li i{grid-column:1/-1;font-style:normal;color:#7a6a55;font-size:11px}
#feed li:nth-child(4){opacity:.7} #feed li:nth-child(5){opacity:.45}
@keyframes in{from{transform:translateX(-30px) scale(.9);opacity:0}}

#snd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;font-size:12px;padding:9px 12px}
#hint{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:5;pointer-events:none;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--ink);color:var(--cheese);padding:9px 14px;border-radius:999px;opacity:0;transition:opacity .4s}
body.live #hint{animation:hint 1s 4.2s forwards}
#hint .m{display:none}#hint{white-space:nowrap}
#hint.gone{opacity:0!important;animation:none!important}
@keyframes hint{to{opacity:1}}
#wait{position:fixed;left:50%;top:44%;transform:translateX(-50%);z-index:5;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);
  text-shadow:0 2px 0 rgba(10,30,90,.5);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

/* whale slam */
#slam{position:fixed;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;text-align:center}
#slam .card{transform:scale(.2) rotate(-10deg);opacity:0}
#slam.go .card{animation:wh 3.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes wh{0%{transform:scale(.2) rotate(-10deg);opacity:0}12%{transform:scale(1.08) rotate(-3deg);opacity:1}20%{transform:scale(1) rotate(-3deg)}85%{opacity:1}100%{opacity:0;transform:scale(1.05) rotate(-3deg) translateY(-30px)}}
#slam .tag{display:inline-block;background:var(--red);color:var(--cream);font-weight:800;font-size:clamp(13px,1.6vw,18px);letter-spacing:.1em;padding:8px 14px;border-radius:999px;text-transform:uppercase}
#slam .amt{font-family:var(--display);font-size:clamp(76px,16vw,220px);line-height:.9;color:var(--cheese);-webkit-text-stroke:7px var(--cream);paint-order:stroke fill;
  text-shadow:0 10px 0 var(--cheese-deep),0 18px 40px rgba(10,30,90,.5)}
#slam .what{font-weight:800;font-size:clamp(16px,2.2vw,26px);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 3px 0 rgba(10,30,90,.6)}

#boot{position:fixed;inset:0;z-index:8;display:grid;place-items:center;transition:opacity .5s;pointer-events:none}
#boot p{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;animation:pulse 1.2s infinite}
body.live #boot{opacity:0}

@media (max-width:1100px) and (min-width:761px){#feed{bottom:calc(130px + env(safe-area-inset-bottom,0px));width:220px}#feed li:nth-child(n+4){display:none}}
@media (max-width:760px){
  #feed{width:min(62vw,230px);bottom:calc(122px + env(safe-area-inset-bottom,0px))}
  #feed li:nth-child(n+3){display:none}
  #counter{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .pill{font-size:12px;padding:10px 12px} .pill.buy{font-size:14px;padding:10px 16px}
  #ca{order:3}
  #snd{bottom:auto;top:calc(128px + env(safe-area-inset-top,0px))}
  #hint{top:34%;font-size:12px}#hint .d{display:none}#hint .m{display:inline}
}
@media (prefers-reduced-motion:reduce){.sky::before{animation:none}}
</style>

<canvas id="gl" aria-label="A giant bowl of queso. Every liquidated long on Binance, Bybit and OKX falls into it, live."></canvas>

<header class="bar">

</header>

</div>
